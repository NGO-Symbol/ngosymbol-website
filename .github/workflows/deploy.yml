name: Deploy

# Publishes the static sites after every merge to main.
# One-time owner setup: documents/operations/deployment.md
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  main-site:
    name: symbol.ngo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: pages
        uses: actions/configure-pages@v5
      # base_path is empty once a custom domain is set, otherwise "/<repo>".
      - run: pnpm --filter @symbol/main generate
        env:
          NITRO_PRESET: github_pages
          NUXT_APP_BASE_URL: ${{ steps.pages.outputs.base_path }}/
      # the design-system gallery is published inside the main site at /design/ (static, noindex) so it can be opened on a phone
      - run: pnpm --filter @symbol/design generate
        env:
          NITRO_PRESET: github_pages
          NUXT_APP_BASE_URL: ${{ steps.pages.outputs.base_path }}/design/
      - run: mkdir -p apps/main/.output/public/design && cp -R apps/design/.output/public/. apps/main/.output/public/design/
      # Project site of «Покажіть свої документи…» at /documentsart/ until documentsart.symbol.ngo is connected.
      # Its photos and fonts are the main site's own files (/media, /fonts), so they are not copied twice.
      - run: pnpm --filter @symbol/documents generate
        env:
          NITRO_PRESET: github_pages
          NUXT_APP_BASE_URL: ${{ steps.pages.outputs.base_path }}/documentsart/
      - run: mkdir -p apps/main/.output/public/documentsart && rsync -a --exclude media --exclude fonts apps/documents/.output/public/ apps/main/.output/public/documentsart/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/main/.output/public
      - id: deployment
        uses: actions/deploy-pages@v4

  street-site:
    name: my-street.symbol.ngo
    # Skipped until the owner creates the deploy repository and sets STREET_DEPLOY_REPO.
    if: vars.STREET_DEPLOY_REPO != ''
    runs-on: ubuntu-latest
    env:
      STREET_HIDDEN: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve base path
        run: |
          if [ -n "$STREET_DOMAIN" ]; then
            echo "NUXT_APP_BASE_URL=/" >> "$GITHUB_ENV"
          else
            echo "NUXT_APP_BASE_URL=/${STREET_REPO#*/}/" >> "$GITHUB_ENV"
          fi
        env:
          STREET_DOMAIN: ${{ vars.STREET_DOMAIN }}
          STREET_REPO: ${{ vars.STREET_DEPLOY_REPO }}
      # While the site is being built it stays hidden: only a "coming soon" page (noindex) is published.
      # Set STREET_HIDDEN to 'false' here when the team opens the site.
      - run: pnpm --filter @symbol/istoriia-vulytsi generate
        if: env.STREET_HIDDEN != 'true'
        env:
          NITRO_PRESET: github_pages
      - name: Choose what to publish
        run: echo "STREET_PUBLISH_DIR=${{ env.STREET_HIDDEN == 'true' && 'apps/istoriia-vulytsi/hidden' || 'apps/istoriia-vulytsi/.output/public' }}" >> "$GITHUB_ENV"
      - uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.STREET_DEPLOY_KEY }}
          external_repository: ${{ vars.STREET_DEPLOY_REPO }}
          publish_branch: gh-pages
          publish_dir: ${{ env.STREET_PUBLISH_DIR }}
          cname: ${{ vars.STREET_DOMAIN }}
          force_orphan: true
          commit_message: ${{ github.event.head_commit.message }}

  documents-site:
    name: documentsart.symbol.ngo
    # Project site of «Покажіть свої документи…». Skipped until the owner creates the deploy repository and sets
    # DOCS_DEPLOY_REPO (+ secret DOCS_DEPLOY_KEY, var DOCS_DOMAIN=documentsart.symbol.ngo, DNS CNAME). See deployment.md.
    if: vars.DOCS_DEPLOY_REPO != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve base path
        run: |
          if [ -n "$DOCS_DOMAIN" ]; then
            echo "NUXT_APP_BASE_URL=/" >> "$GITHUB_ENV"
          else
            echo "NUXT_APP_BASE_URL=/${DOCS_REPO#*/}/" >> "$GITHUB_ENV"
          fi
        env:
          DOCS_DOMAIN: ${{ vars.DOCS_DOMAIN }}
          DOCS_REPO: ${{ vars.DOCS_DEPLOY_REPO }}
      - run: pnpm --filter @symbol/documents generate
        env:
          NITRO_PRESET: github_pages
      - uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DOCS_DEPLOY_KEY }}
          external_repository: ${{ vars.DOCS_DEPLOY_REPO }}
          publish_branch: gh-pages
          publish_dir: apps/documents/.output/public
          cname: ${{ vars.DOCS_DOMAIN }}
          force_orphan: true
          commit_message: ${{ github.event.head_commit.message }}
