name: Keepalive

# GitHub switches off scheduled workflows in a public repository after 60 days without repository activity, which
# would silently stop the uptime monitor (uptime.yml). Once a month this workflow re-enables both scheduled workflows
# through the API and prints when the monitor last ran. The repository normally has commits far more often than every
# 60 days; this is the safety net for a quiet period. Details: documents/operations/monitoring.md.
on:
  schedule:
    - cron: '23 5 1 * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enable the scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in uptime.yml keepalive.yml; do
            gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/enable" \
              && echo "enabled: $workflow" \
              || echo "::warning::Could not enable $workflow (it may not exist on the default branch yet)"
          done
      - name: When did the monitor last run?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow uptime.yml --event schedule --limit 1 --json createdAt --jq '.[0].createdAt' 2>/dev/null || true)
          echo "Last scheduled uptime run: ${last:-none yet}"
          if [ -z "$last" ]; then echo "::warning::No scheduled uptime run found. Open Actions → Uptime and check that it is enabled."; fi
